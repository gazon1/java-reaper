# Цели рейпера: какие программы-демоны мы убираем и как их читать.
#
# Файл необязателен: если его нет, работают встроенные цели Gradle и Kotlin
# (ровно как раньше). Файл переопределяет встроенные цели по имени и может
# добавлять новые.
#
# Что здесь описывается (и что НЕ описывается):
#   match_cmdline        — подстрока в cmdline процесса, по которой мы его узнаём;
#   log_name_regex       — регулярка на ИМЯ файла лога (лог ищем среди открытых
#                          дескрипторов /proc/PID/fd — точно, без эвристик).
#                          Пустая регулярка = «своего лога нет»: такой демон
#                          защищён правилом no-log, его не убить;
#   activity             — как понять по логу, что демон работал:
#                            mtime    — признак активности = время последней
#                                       записи в лог (для программ без своих
#                                       маркеров; просто и надёжно);
#                            markers  — активность = маркеры начала/конца
#                                       работы в тексте лога;
#   ts_format            — формат таймстемпа в строке лога: iso (со смещением)
#                          или local (без смещения, местное время);
#   build_start/end/cancel — сами маркеры (для activity: markers);
#   self_timeout_seconds — через сколько демон умирает САМ (у Gradle 180 мин:
#                          наш порог обязан быть выше, иначе мы конкурируем с
#                          Gradle за одни и те же демоны и проигрываем);
#   protects             — какие виды демонов этот вид защищает, пока сам
#                          работает («идёт сборка Gradle → компилятор нужен»);
#   rebuildable          — «это пересоздаваемый кэш, его можно убить».
#                          Не написали — рейпер не убьёт никогда («не знаем ⇒
#                          оставляем»). Для сервисов и баз данных это правда;
#   log_trim             — «лог этого демона можно усекать» (усечение сдвигает
#                          mtime, а у целей, где mtime — признак простоя, это
#                          врёт: демон выглядел бы «только что активным»).
#
# ПОРОГИ (idle_seconds, recreate_cost_seconds, build_active_seconds,
# stuck_after_seconds, min_footprint_mb, large_daemon_mb) — их можно задать
# здесь, и тогда они относятся к этому виду. У видов, для которых порог здесь
# не написан, берётся плоский ключ из config (IDLE_SECONDS,
# KOTLIN_IDLE_SECONDS и прочие) — как раньше.
#
#   * Явно заданный плоский ВИДОВОЙ ключ (KOTLIN_IDLE_SECONDS) главнее
#     значения здесь: оператор правил его — значит, это и есть намерение.
#   * Общий плоский ключ (IDLE_SECONDS) менее специфичен, поэтому значение
#     здесь главнее; но если ключ задан и расходится — рейпер предупредит.
#
# ВАЖНО: порог для новой цели сначала измеряется (tools/simulate.py по
# накопленной истории), и только потом выкатывается. Неизмеренный порог —
# это наугад.

version: 1

targets:
  # ---- Gradle ----
  - name: gradle
    label: Gradle
    match_cmdline: "org.gradle.launcher.daemon.bootstrap.GradleDaemon"
    log_name_regex: '^daemon-\d+\.out\.log$'
    activity: markers
    ts_format: iso
    build_start: "Received command: Build"
    build_end: "Marking the daemon as idle"
    build_end_alt: "after build finished"
    cancel: "client disconnection detected"
    self_timeout_seconds: 10800  # Gradle убивает демона сам через 180 мин
    # Где лежат логи цели (шаблоны пути). Список подставляется в targets.yaml,
    # потому что раскладка — свойство машины, а не программы.
    log_globs:
      - "~/.gradle/daemon/*/daemon-*.out.log"
      - "~/.gradle-user-home/daemon/*/daemon-*.out.log"
      # Проекты часто ставят свой GRADLE_USER_HOME — логи копятся и там.
      - "~/orca/workspaces/*/*/.gradle-user-home/daemon/*/daemon-*.out.log"
    # PID в имени лога настоящий — можно сверяться с живым процессом.
    log_pid_regex: '^daemon-(?P<pid>\d+)\.out\.log$'
    protects: [kotlin]           # пока идёт сборка, компилятор нужен
    rebuildable: true
    log_trim: true               # лог можно усекать: простой меряется по маркерам
    # Пороги Gradle живут в config (IDLE_SECONDS=21600, …) — здесь они не
    # нужны. Раскомментируйте, чтобы задать их здесь (и уберите плоские
    # ключи из config, иначе рейпер будет предупреждать о расхождении).
    # idle_seconds: 21600
    # recreate_cost_seconds: 40
    # build_active_seconds: 1800
    # stuck_after_seconds: 3600
    # min_footprint_mb: 128
    # large_daemon_mb: 4096

  # ---- Kotlin ----
  - name: kotlin
    label: Kotlin
    match_cmdline: "org.jetbrains.kotlin.daemon.KotlinCompileDaemon"
    log_name_regex: '^kotlin-daemon\..*\.log$'
    activity: mtime            # своих маркеров у Kotlin нет
    rebuildable: true
    log_globs:
      - "/tmp/kotlin-daemon.*.log*"
    # Один демон пишет в несколько файлов (ротация .00/.01) и держит
    # открытым только последний: открытый файл защищает всю группу.
    log_group_regex: '^(?P<group>kotlin-daemon\.\d{4}-\d{2}-\d{2}\.\d{2}-\d{2}-\d{2}-\d+)\.\d+\.log(?:\.lck)?$'
    # Эти маркеры создаёт и удаляет сам Kotlin — трогать нельзя.
    forbidden_prefixes:
      - "kotlin-compiler-client-"
      - "kotlin-compiler-in-"
      - "kotlin-compilation-session-"
    # log_trim: false — у Kotlin mtime лога и есть признак простоя,
    # усечение сдвинуло бы его (демон выглядел бы «только что активным»).
    # Пороги — в config (KOTLIN_IDLE_SECONDS=7200, …).

  # ---- Пример новой цели (закомментирован) ----
